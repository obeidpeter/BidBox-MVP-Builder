<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">BidBox — tender readiness grounded in evidence</title>
  <desc id="description">A navy BidBox brand card with an ivory and teal stacked-box B monogram and evidence-led tender readiness message.</desc>
  <rect width="1200" height="630" fill="#0D1B2F"/>
  <g transform="translate(72 72) scale(2)">
    <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="#0D1B2F" stroke="#62C8B5" stroke-opacity="0.25"/>
    <path fill-rule="evenodd" d="M8 6H18L23 10V12L18 16H8V6ZM11.5 9.5V12.5H16.8L19 11L16.8 9.5H11.5Z" fill="#F7F5F0"/>
    <path fill-rule="evenodd" d="M8 17H19L24 21V23L19 27H8V17ZM11.5 20.5V23.5H17.8L20 22L17.8 20.5H11.5Z" fill="#62C8B5"/>
  </g>
  <text x="154" y="116" fill="#F7F5F0" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">BidBox</text>
  <line x1="72" y1="184" x2="1128" y2="184" stroke="#2E4059" stroke-width="2"/>
  <text x="72" y="284" fill="#62C8B5" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">TENDER READINESS</text>
  <text x="72" y="362" fill="#F7F5F0" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Grounded in evidence.</text>
  <text x="72" y="424" fill="#D3D9E3" font-family="Arial, Helvetica, sans-serif" font-size="30">Source-cited requirements • Human review • Controlled export</text>
  <rect x="72" y="494" width="1056" height="72" rx="8" fill="#13253D" stroke="#2E4059"/>
  <circle cx="108" cy="530" r="8" fill="#62C8B5"/>
  <text x="132" y="540" fill="#D3D9E3" font-family="Arial, Helvetica, sans-serif" font-size="24">No award guarantees. No fabricated credentials. No unsupported claims.</text>
</svg>
